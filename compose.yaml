name: damascenosrv-finances

x-php: &php
  image: damascenosrv-finances-php:local
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: php
    args:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
  working_dir: /var/www/html
  environment:
    APP_NAME: DamascenoSRV Finances
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:${APP_PORT:-8080}
    APP_TIMEZONE: America/Sao_Paulo
    DB_CONNECTION: mariadb
    DB_URL: ""
    DB_HOST: database
    DB_PORT: "3306"
    DB_SOCKET: ""
    DB_DATABASE: ${DOCKER_DB_DATABASE:-finances}
    DB_USERNAME: ${DOCKER_DB_USERNAME:-finances}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-finances_local_only}
    CACHE_STORE: database
    SESSION_DRIVER: database
    SESSION_DOMAIN: ""
    SESSION_SECURE_COOKIE: "false"
    QUEUE_CONNECTION: database
    MAIL_MAILER: log
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  init: true

services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DOCKER_DB_DATABASE:-finances}
      MARIADB_USER: ${DOCKER_DB_USERNAME:-finances}
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:-finances_local_only}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  setup:
    <<: *php
    command: ["finances-setup"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    <<: *php
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    environment:
      APP_URL: http://localhost:${APP_PORT:-8080}
      VITE_DOCKER: "true"
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.VITE_PORT + '/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    init: true
    restart: unless-stopped

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  database:
  vendor:
  node_modules:
